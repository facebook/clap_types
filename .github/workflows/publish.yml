name: Publish to crates.io

# Publish a new version of `clap_types` to crates.io whenever a GitHub Release
# is published from a `v*` tag (e.g. `v0.1.1`). Also exposes a manual
# `workflow_dispatch` trigger for one-off publishes.
#
# Authentication uses crates.io trusted publishing: GitHub Actions presents an
# OIDC token to crates.io, which exchanges it for a short-lived publish
# credential. There is no long-lived `CARGO_REGISTRY_TOKEN` secret to rotate.
# The trusted publisher must be registered on the crate at
# https://crates.io/crates/clap_types/settings before this workflow can
# succeed.

on:
  release:
    types: [published]
  workflow_dispatch:

# Required for OIDC trusted publishing.
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    # Skip release events that aren't on a `v*` tag, so a release made against
    # an unrelated tag can't accidentally publish.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish crate
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
